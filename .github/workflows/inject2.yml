name: Inject Telegram x_vip_9 into IPA
on:
  push:
  workflow_dispatch:
jobs:
  inject:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: |
          curl -L --fail --retry 5 --retry-all-errors -o app.ipa "https://github.com/tarek8310/tgdylib/releases/download/v1/XENZO.EXTERNAL_8.0.ipa"
      - name: Build dylib
        run: |
          cat > tg.m << 'SRC'
          #import <UIKit/UIKit.h>
          __attribute__((constructor))
          static void init() {
            [[NSNotificationCenter defaultCenter]
              addObserverForName:UIApplicationDidBecomeActiveNotification
              object:nil queue:NSOperationQueue.mainQueue
              usingBlock:^(NSNotification *n) {
                static BOOL opened = NO;
                if (opened) return;
                opened = YES;
                NSURL *u = [NSURL URLWithString:@"https://t.me/x_vip_9"];
                [UIApplication.sharedApplication openURL:u options:@{} completionHandler:nil];
              }];
          }
          SRC
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -framework UIKit -framework Foundation -miphoneos-version-min=13.0 -o Telegram.dylib tg.m
      - name: Inject
        run: |
          pip3 install lief Pillow --break-system-packages
          rm -rf work && mkdir work && cd work
          unzip -q ../app.ipa
          APP=
          EXE=
          mkdir -p "/Frameworks"
          cp ../Telegram.dylib "/Frameworks/Telegram.dylib"
          find "" -iname "Mriosnhat*" -delete
          python3 << 'PY'
          import sys, lief, glob
          p = glob.glob("Payload/*.app")[0]
          exe = open(p + "/Info.plist").read()
          import subprocess
          exe_name = subprocess.check_output(["/usr/libexec/PlistBuddy","-c","Print :CFBundleExecutable",p+"/Info.plist"]).decode().strip()
          fat = lief.MachO.parse(p + "/" + exe_name)
          for b in fat:
              for lib in [l for l in b.libraries if "Mriosnhat" in l.name]:
                  b.remove(lib)
              b.add_library("@executable_path/Frameworks/Telegram.dylib")
          fat.write(p + "/" + exe_name)
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleName VIP" "/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName VIP" "/Info.plist"
          python3 << 'PYICON'
          import base64, glob
          from PIL import Image
          import io
          data = ""
          img = Image.open(io.BytesIO(base64.b64decode(data))).convert("RGBA")
          app = glob.glob("Payload/*.app")[0]
          sizes = [20,29,40,57,58,60,76,80,87,100,114,120,152,167,180,1024]
          for f in glob.glob(f"{app}/**/*.png", recursive=True) + glob.glob(f"{app}/*.png"):
              try:
                  from PIL import Image as Im
                  w,h = Im.open(f).size
                  if w == h and w in sizes:
                      img.resize((w,w), Image.LANCZOS).save(f)
              except:
                  pass
          PYICON
          zip -qry ../injected.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: injected.ipa
