name: Inject Telegram into IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download link of the IPA"
        required: true
jobs:
  inject:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: |
          curl -L --fail -o app.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh app.ipa
      - name: Build dylib
        run: |
          cat > tg.m <<'SRC'
          #import <UIKit/UIKit.h>

          __attribute__((constructor))
          static void init() {
            [[NSNotificationCenter defaultCenter]
              addObserverForName:UIApplicationDidBecomeActiveNotification
              object:nil queue:NSOperationQueue.mainQueue
              usingBlock:^(NSNotification *n) {
                static BOOL opened = NO;
                if (opened) return;
                opened = YES;
                NSURL *u = [NSURL URLWithString:@"https://t.me/fluorite_manager"];
                [UIApplication.sharedApplication openURL:u
                  options:@{} completionHandler:nil];
              }];
          }
          SRC
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework UIKit -framework Foundation \
            -miphoneos-version-min=13.0 -o Telegram.dylib tg.m
      - name: Inject
        run: |
          pip3 install lief --break-system-packages || pip3 install lief
          rm -rf work && mkdir work && cd work
          unzip -q ../app.ipa
          APP=$(ls -d Payload/*.app | head -n 1)
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          mkdir -p "$APP/Frameworks"
          cp ../Telegram.dylib "$APP/Frameworks/Telegram.dylib"
          python3 - "$APP/$EXE" <<'PY'
          import sys, lief
          p = sys.argv[1]
          fat = lief.MachO.parse(p)
          for b in fat:
              b.add_library("@executable_path/Frameworks/Telegram.dylib")
          fat.write(p)
          PY
          zip -qry ../injected.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: injected.ipa
