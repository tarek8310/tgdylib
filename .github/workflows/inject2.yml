name: Inject Telegram x_vip_9 into IPA
on:
  push:
  workflow_dispatch:
jobs:
  inject:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: curl -L --fail --retry 5 -o app.ipa "https://github.com/tarek8310/tgdylib/releases/download/v1/XENZO.EXTERNAL_8.0.ipa"
      - name: Build dylib
        run: |
          cat > tg.m <<'SRC'
          #import <UIKit/UIKit.h>
          __attribute__((constructor))
          static void init() {
            [[NSNotificationCenter defaultCenter]
              addObserverForName:UIApplicationDidBecomeActiveNotification
              object:nil queue:NSOperationQueue.mainQueue
              usingBlock:^(NSNotification *n) {
                static BOOL opened = NO;
                if (opened) return;
                opened = YES;
                NSURL *u = [NSURL URLWithString:@"https://t.me/x_vip_9"];
                [UIApplication.sharedApplication openURL:u options:@{} completionHandler:nil];
              }];
          }
          SRC
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework UIKit -framework Foundation \
            -miphoneos-version-min=13.0 -o Telegram.dylib tg.m
      - name: Inject
        run: |
          pip3 install lief --break-system-packages
          rm -rf work && mkdir work && cd work
          unzip -q ../app.ipa
          APP=$(ls -d Payload/*.app | head -n 1)
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          cp ../Telegram.dylib "$APP/Frameworks/Telegram.dylib" 2>/dev/null || (mkdir -p "$APP/Frameworks" && cp ../Telegram.dylib "$APP/Frameworks/Telegram.dylib")
          find "$APP" -iname "Mriosnhat*" -delete
          python3 -c "
          import lief, glob
          app = glob.glob('Payload/*.app')[0]
          import subprocess
          exe = subprocess.check_output(['/usr/libexec/PlistBuddy','-c','Print :CFBundleExecutable',app+'/Info.plist']).decode().strip()
          fat = lief.MachO.parse(app+'/'+exe)
          for b in fat:
              [b.remove(l) for l in b.libraries if 'Mriosnhat' in l.name]
              b.add_library('@executable_path/Frameworks/Telegram.dylib')
          fat.write(app+'/'+exe)
          "
          /usr/libexec/PlistBuddy -c "Set :CFBundleName VIP" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName VIP" "$APP/Info.plist"
          zip -qry ../injected.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: injected-ipa
          path: injected.ipa
